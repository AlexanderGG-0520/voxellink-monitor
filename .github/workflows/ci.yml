name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Test
        run: go test ./...
      - name: Build service
        run: go build ./cmd/monitor
      - name: Validate Compose
        env:
          VOXELLINK_API_BASE_URL: https://voxellink.invalid
          VOXELLINK_API_TOKEN: test-token
          INTEGRATION_SYNC_TOKEN: test-integration-token-value
          DISCORD_CLIENT_ID: test-client
          DISCORD_CLIENT_SECRET: test-secret
          SESSION_SECRET: test-session-secret-value-long-enough
        run: docker compose --env-file .env.example config -q
      - name: Build container
        run: docker build -t voxellink-monitor:ci .
