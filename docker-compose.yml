services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxellink_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-voxellink_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["api"]
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      VOXELLINK_API_BASE_URL: ${VOXELLINK_API_BASE_URL:?set VOXELLINK_API_BASE_URL in .env}
      VOXELLINK_API_TOKEN: ${VOXELLINK_API_TOKEN:?set VOXELLINK_API_TOKEN in .env}
      INTEGRATION_SYNC_TOKEN: ${INTEGRATION_SYNC_TOKEN:?set INTEGRATION_SYNC_TOKEN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-60s}
      STATUS_TIMEOUT: ${STATUS_TIMEOUT:-5s}
      FAILURE_RETRY_INTERVAL: ${FAILURE_RETRY_INTERVAL:-10s}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      CLOUDFLARED_BIN: ${CLOUDFLARED_BIN:-/usr/local/bin/cloudflared}
      CLOUDFLARED_STARTUP_TIMEOUT: ${CLOUDFLARED_STARTUP_TIMEOUT:-10s}
      VOXELLINK_API_BASE_URL: ${VOXELLINK_API_BASE_URL:-}
      VOXELLINK_API_TOKEN: ${VOXELLINK_API_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build: .
    command: ["bot"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
